###########################################################
# 1) 自动同步上游仓库指定分支 -> 当前仓库子目录 (git subtree)
#    同步列表在 env.UPSTREAMS 中维护, 每行格式: 仓库地址|分支
#    目标子目录自动使用仓库名, 存放在 env.DEST_BASE 根目录下
#    采用 git subtree 合并: 保留上游完整提交历史,
#      GitHub 上浏览子目录 History 可看到上游 commits
#    每天自动检查, 上游有变化才提交
# 2) 广告规则合并去重 -> 发布到 gh-pages (由 123.yml 合并进来)
# 3) 全部任务执行完毕后, 统一清理删除运行记录
###########################################################
name: Sync Upstream

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: '0 20 * * *'   # 每天 UTC 20:00 (北京时间 04:00)
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
  # 同步目标根目录 (实际存放: DEST_BASE/仓库名)
  DEST_BASE: package
  # 同步结果存放的专用分支
  SYNC_BRANCH: upstream-sync
  # 同步列表: 仓库地址|分支 (以 # 开头的行会跳过)
  UPSTREAMS: |
    https://github.com/xztxy/luci-app-autoupdate|main
    https://github.com/fw876/helloworld|master
    https://github.com/sirpdboy/luci-app-netdata|main
    https://github.com/sirpdboy/luci-app-adguardhome|main
    https://github.com/Openwrt-Passwall/openwrt-passwall-packages|main
    https://github.com/Openwrt-Passwall/openwrt-passwall|main
    https://github.com/Openwrt-Passwall/openwrt-passwall2|main
    https://github.com/liandu2024/Open-Box|main
    https://github.com/byJoey/warp-masque-actions|main

jobs:
  Sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout 当前仓库
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # subtree 需要完整历史

      - name: 🔀 切换到同步专用分支
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/${SYNC_BRANCH}; then
            git checkout -B "${SYNC_BRANCH}" "origin/${SYNC_BRANCH}"
            echo "已切换到现有同步分支: ${SYNC_BRANCH}"
          else
            git checkout -B "${SYNC_BRANCH}"
            echo "首次创建同步分支: ${SYNC_BRANCH}"
          fi

      - name: 🔄 同步上游仓库到子目录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS='|' read -r URL BRANCH; do
            [[ -z "$URL" || "$URL" == \#* ]] && continue
            # 目标子目录 = DEST_BASE/仓库名
            REPO_NAME=$(basename "$URL" .git)
            DEST="${DEST_BASE}/${REPO_NAME}"
            echo "=============================================="
            echo "同步: $URL ($BRANCH) -> $DEST"

            # 判断子目录是否已存在 subtree 历史 (通过 subtree 元数据提交识别)
            if git log --grep="git-subtree-dir: ${DEST}\$" --oneline -1 | grep -q .; then
              echo "已存在 subtree, 执行 subtree pull (只拉取上游增量提交)"
              git subtree pull --prefix="$DEST" "$URL" "$BRANCH" \
                --message "🔄 Sync upstream: $REPO_NAME@$BRANCH" || {
                  echo "::warning::subtree pull 失败 (可能冲突), 以上游为准重新添加"
                  git reset --hard
                  git rm -rq --cached "$DEST" 2>/dev/null || true
                  rm -rf "$DEST"
                  git commit -q --allow-empty -m "🧹 重置 $DEST (subtree pull 异常, 重新同步)"
                  git subtree add --prefix="$DEST" "$URL" "$BRANCH" \
                    --message "🔄 Re-sync upstream: $REPO_NAME@$BRANCH"
                }
            else
              echo "首次同步, 执行 subtree add (合并上游完整历史)"
              git rm -rq --cached "$DEST" 2>/dev/null || true
              rm -rf "$DEST"
              git diff --cached --quiet || git commit -qm "🧹 清理 $DEST 旧副本, 改用 subtree 同步"
              git subtree add --prefix="$DEST" "$URL" "$BRANCH" \
                --message "🔄 Sync upstream: $REPO_NAME@$BRANCH (subtree 初始化)"
            fi
            echo "完成: $DEST 最新提交 $(git log -1 --pretty=format:'%h %s' -- "$DEST")"
          done <<< "$UPSTREAMS"

      - name: 🚀 推送
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/${SYNC_BRANCH}; then
            AHEAD=$(git rev-list --count origin/${SYNC_BRANCH}..HEAD)
          else
            AHEAD=1
          fi
          if [[ "$AHEAD" -gt 0 ]]; then
            echo "待推送 $AHEAD 个提交:"
            git log --oneline origin/${SYNC_BRANCH}..HEAD 2>/dev/null | head -20 || git log --oneline -20
            git push origin "HEAD:${SYNC_BRANCH}"
            echo "✅ 已推送到 ${SYNC_BRANCH}"
          else
            echo "上游无变化, 无需推送"
          fi

  # 广告规则合并去重：上游同步完成后执行，合并上游规则并发布到 gh-pages
  MergeRules:
    name: 🧹 广告规则合并去重
    needs: Sync
    # 上游同步结束后无条件执行；使用 always() 保证 Sync 失败时也照常合并规则
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📦 检出仓库
        uses: actions/checkout@v5

      - name: 📁 创建临时目录和输出目录
        run: |
          mkdir -p temp output

      - name: ⬇️ 下载所有上游规则
        run: |
          # ========== 在这里配置你的规则源列表 ==========
          RULE_URLS=(
            "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt"
            "https://easylist-downloads.adblockplus.org/easylist.txt"
            "https://easylist-downloads.adblockplus.org/easylistchina.txt"
            "https://anti-ad.net/easylist.txt"
            "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt"
            "https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt"
            "https://raw.githubusercontent.com/YTjungle666/yt-adguard-rules/main/allowlist.txt"
          )
          # =============================================

          # 循环下载每个规则文件
          i=0
          for url in "${RULE_URLS[@]}"; do
            i=$((i+1))
            echo "正在下载第 $i 个规则源: $url"
            curl -sL --fail "$url" -o "temp/source_$i.txt" || echo "警告: 下载失败 $url"
          done

      - name: 🔀 合并并去重规则
        id: merge_rules
        run: |
          # 核心去重逻辑
          cat temp/*.txt \
            | grep -v "^!" `# 过滤 adblock 格式注释行` \
            | grep -v "^#" `# 过滤 hosts 格式注释行` \
            | grep -v "^$" `# 过滤空行` \
            | sort -u `# 排序并去除完全重复的行` \
            > output/merged-blocklist.txt

          # 统计并输出规则数量
          BEFORE=$(cat temp/*.txt | grep -v "^!" | grep -v "^#" | grep -v "^$" | wc -l)
          AFTER=$(wc -l < output/merged-blocklist.txt)
          REMOVED=$((BEFORE - AFTER))

          echo "合并前规则总数: $BEFORE"
          echo "去重后规则总数: $AFTER"
          echo "去重了 $REMOVED 条重复规则"

          # 将统计结果写入全局环境变量，供后续通知步骤调用
          echo "RULES_BEFORE=$BEFORE" >> $GITHUB_ENV
          echo "RULES_AFTER=$AFTER" >> $GITHUB_ENV
          echo "RULES_REMOVED=$REMOVED" >> $GITHUB_ENV

      - name: 🕘 获取上次发布的规则
        id: fetch_previous
        run: |
          # 从 gh-pages 分支拉取上次发布的合并规则，用于对比本次变化
          if git fetch origin gh-pages --depth=1 2>/dev/null \
            && git show origin/gh-pages:merged-blocklist.txt > temp/previous-blocklist.txt 2>/dev/null; then
            PREV_COUNT=$(wc -l < temp/previous-blocklist.txt | tr -d ' ')
            echo "已获取上次发布的规则: $PREV_COUNT 条"
            echo "HAS_PREVIOUS=true" >> $GITHUB_ENV
          else
            echo "gh-pages 分支或历史规则不存在，本次为首次发布，跳过变化对比"
            echo "HAS_PREVIOUS=false" >> $GITHUB_ENV
          fi

      - name: 🔍 对比上次与本次规则变化
        if: env.HAS_PREVIOUS == 'true'
        run: |
          # comm 要求输入有序，统一使用 C locale 排序，保证对比结果稳定
          LC_ALL=C sort temp/previous-blocklist.txt > temp/prev.sorted
          LC_ALL=C sort output/merged-blocklist.txt > temp/curr.sorted
          # 本次新增：本次列表有、上次列表没有（comm -13 取第二个文件独有行）
          LC_ALL=C comm -13 temp/prev.sorted temp/curr.sorted > output/rules-added.txt
          # 本次移除：上次列表有、本次列表没有（comm -23 取第一个文件独有行）
          LC_ALL=C comm -23 temp/prev.sorted temp/curr.sorted > output/rules-removed.txt

          ADDED=$(wc -l < output/rules-added.txt | tr -d ' ')
          DELETED=$(wc -l < output/rules-removed.txt | tr -d ' ')
          echo "RULES_ADDED=$ADDED" >> $GITHUB_ENV
          echo "RULES_DELETED=$DELETED" >> $GITHUB_ENV

          echo "本次新增规则: $ADDED 条"
          echo "本次移除规则: $DELETED 条"
          echo "::group::本次新增规则（前20条）"
          head -20 output/rules-added.txt
          echo "::endgroup::"
          echo "::group::本次移除规则（前20条）"
          head -20 output/rules-removed.txt
          echo "::endgroup::"

      - name: 🚀 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages

      - name: 📢 发送企业微信通知
        if: always() # 无论成功/失败都执行通知
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 使用 Python 构造消息体，规则文本中的引号/反斜杠由 json.dumps 自动转义
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta

          repo = os.environ["GITHUB_REPOSITORY"]
          success = os.environ.get("JOB_STATUS") == "success"
          # 仅在合并成功且存在历史规则时展示变化（失败时 gh-pages 未更新，避免误导）
          show_diff = success and os.environ.get("HAS_PREVIOUS") == "true"

          if success:
              status, color, msg = "✅ 规则合并成功", "info", "规则已更新并发布。"
          else:
              status, color, msg = "❌ 规则合并失败", "warning", "请点击下方日志链接排查具体错误。"

          def env_int(key):
              return (os.environ.get(key) or "0").strip()

          def samples(path, limit=3):
              result = []
              try:
                  with open(path, encoding="utf-8", errors="replace") as f:
                      for raw in f:
                          text = raw.strip().replace("`", "")
                          if not text:
                              continue
                          result.append(text if len(text) <= 60 else text[:57] + "...")
                          if len(result) >= limit:
                              break
              except OSError:
                  pass
              return result

          now = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d %H:%M")

          lines = [
              "### AdGuard 规则合并通知",
              f'> **状态：** <font color="{color}">{status}</font>',
              f"> **合并前规则数：** {env_int('RULES_BEFORE')} 条",
              f"> **去重后规则数：** {env_int('RULES_AFTER')} 条",
              f"> **移除重复规则：** {env_int('RULES_REMOVED')} 条",
          ]

          if show_diff:
              lines.append(f"> **较上次新增：** {env_int('RULES_ADDED')} 条")
              lines.append(f"> **较上次移除：** {env_int('RULES_DELETED')} 条")
              added = samples("output/rules-added.txt")
              deleted = samples("output/rules-removed.txt")
              if added:
                  lines.append("> **新增样例：** " + " / ".join(f"`{x}`" for x in added))
              if deleted:
                  lines.append("> **移除样例：** " + " / ".join(f"`{x}`" for x in deleted))
          elif success:
              lines.append("> **规则变化：** 首次发布，无历史对比数据")

          lines += [
              f"> **触发分支：** {os.environ.get('GITHUB_REF_NAME', '')}",
              f"> **执行时间：** {now} 北京时间",
              "",
              msg,
              f"> **订阅地址：** [点击复制](https://raw.githubusercontent.com/{repo}/gh-pages/merged-blocklist.txt)",
          ]
          if show_diff:
              lines.append(
                  f"> **变化明细：** [新增 rules-added.txt](https://raw.githubusercontent.com/{repo}/gh-pages/rules-added.txt)"
                  f" / [移除 rules-removed.txt](https://raw.githubusercontent.com/{repo}/gh-pages/rules-removed.txt)"
              )
          lines += ["", f"[点击查看运行日志]({os.environ['RUN_URL']})"]

          payload = {
              "msgtype": "markdown",
              "markdown": {"content": "\n".join(lines)},
          }
          req = urllib.request.Request(
              os.environ["WEIXIN_WEBHOOK"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req, timeout=15).read()
          print("企业微信通知已发送")
          PY

  # 兜底收尾：Sync 与 MergeRules 全部执行完毕后再删除运行记录
  Cleanup:
    name: 🗑️ 清理运行记录
    needs: [Sync, MergeRules]
    # always(): 上游同步或规则合并失败也要照常清理，避免运行记录堆积
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 🗑️ 删除运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
